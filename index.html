<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TBC შეთავაზებების მონიტორინგი — BOG Intelligence</title>
<meta name="description" content="TBC Bank-ის შეთავაზებების ცოცხალი მონიტორინგი — Bank of Georgia-ს შიდა ანალიტიკური ხელსაწყო.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#091A2B;
    --navy-2:#0f2740;
    --navy-3:#15324f;
    --orange:#ff5c0a;
    --orange-dim:#c94708;
    --slate:#5A6670;
    --slate-soft:#8a939c;
    --tan:#CDA176;
    --white:#ffffff;
    --paper:#f4f5f6;
    --line:#e4e6e8;
    --danger:#e2401f;
    --font-body:'Noto Sans Georgian','Noto Sans',system-ui,sans-serif;
    --font-mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--paper);
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--orange);color:var(--white);}

  /* ---------- top identity bar ---------- */
  .topbar{
    background:var(--navy);
    color:var(--white);
    padding:14px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    border-bottom:3px solid var(--orange);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-family:var(--font-mono);
    letter-spacing:0.5px;
  }
  .brand .mark{
    font-weight:700;
    font-size:15px;
    background:var(--orange);
    color:var(--navy);
    padding:3px 8px;
    border-radius:3px;
  }
  .brand .sub{
    font-size:12px;
    color:var(--slate-soft);
    text-transform:uppercase;
  }
  .status-pill{
    font-family:var(--font-mono);
    font-size:11px;
    display:flex;
    align-items:center;
    gap:6px;
    color:var(--slate-soft);
    white-space:nowrap;
  }
  .topnav{
    display:flex;
    gap:4px;
  }
  .navlink{
    font-family:var(--font-mono);
    font-size:12.5px;
    text-decoration:none;
    color:var(--slate-soft);
    padding:7px 14px;
    border-radius:5px;
    transition:all .15s;
  }
  .navlink:hover{color:var(--white);background:var(--navy-3);}
  .navlink.active{color:var(--navy);background:var(--orange);font-weight:700;}
  @media (max-width:640px){
    .topnav{margin-right:0;}
    .navlink{padding:6px 9px;font-size:11px;}
  }
  .status-dot{
    width:7px;height:7px;border-radius:50%;
    background:#38d97a;
    box-shadow:0 0 0 0 rgba(56,217,122,.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(56,217,122,.55);}
    70%{box-shadow:0 0 0 7px rgba(56,217,122,0);}
    100%{box-shadow:0 0 0 0 rgba(56,217,122,0);}
  }

  /* ---------- stat strip ---------- */
  .statstrip{
    background:var(--navy-2);
    border-bottom:1px solid var(--navy-3);
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .statstrip::-webkit-scrollbar{display:none;}
  .stat{
    flex:1 0 auto;
    padding:14px 24px;
    border-right:1px solid var(--navy-3);
    min-width:150px;
  }
  .stat .num{
    font-family:var(--font-mono);
    font-size:26px;
    font-weight:700;
    color:var(--orange);
    line-height:1;
  }
  .stat .lbl{
    font-size:11px;
    color:var(--slate-soft);
    margin-top:6px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .stat.tan .num{color:var(--tan);}

  /* ---------- ticker ---------- */
  .ticker-wrap{
    background:var(--navy);
    overflow:hidden;
    border-bottom:1px solid var(--navy-3);
    white-space:nowrap;
  }
  .ticker{
    display:inline-block;
    padding:8px 0;
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--white);
    animation:scroll-left 90s linear infinite;
  }
  .ticker span.item{margin-right:40px;}
  .ticker .up{color:var(--orange);font-weight:600;}
  @keyframes scroll-left{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticker{animation:none;}
    .status-dot{animation:none;}
  }

  /* ---------- filter bar ---------- */
  .filterbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--white);
    border-bottom:1px solid var(--line);
    padding:14px 24px;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    box-shadow:0 2px 10px rgba(9,26,43,0.04);
  }
  .search-box{
    flex:1 1 240px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:10px 14px 10px 34px;
    border:1.5px solid var(--line);
    border-radius:6px;
    font-family:var(--font-body);
    font-size:14px;
    background:var(--paper);
    color:var(--navy);
  }
  .search-box input:focus{
    outline:none;
    border-color:var(--orange);
    background:var(--white);
  }
  .search-box::before{
    content:"⌕";
    position:absolute;
    left:12px;top:50%;
    transform:translateY(-50%);
    color:var(--slate-soft);
    font-size:16px;
  }
  select, .toggle-btn{
    font-family:var(--font-body);
    font-size:13.5px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:6px;
    background:var(--white);
    color:var(--navy);
    cursor:pointer;
  }
  select:focus, .toggle-btn:focus-visible, input:focus-visible, button:focus-visible, .card:focus-visible{
    outline:2px solid var(--orange);
    outline-offset:2px;
  }
  .toggle-btn{
    display:flex;align-items:center;gap:6px;
    white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s;
  }
  .toggle-btn[aria-pressed="true"]{
    background:var(--navy);
    border-color:var(--navy);
    color:var(--white);
  }
  .toggle-btn .dotmark{
    width:7px;height:7px;border-radius:50%;
    background:var(--orange);
  }

  .catrow{
    padding:0 24px 14px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    background:var(--white);
    border-bottom:1px solid var(--line);
    scrollbar-width:thin;
  }
  .pill{
    flex:none;
    font-family:var(--font-mono);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:20px;
    border:1.5px solid var(--line);
    background:var(--paper);
    color:var(--slate);
    cursor:pointer;
    white-space:nowrap;
    transition:all .15s;
  }
  .pill:hover{border-color:var(--orange);color:var(--orange-dim);}
  .pill[aria-pressed="true"]{
    background:var(--orange);
    border-color:var(--orange);
    color:var(--white);
    font-weight:600;
  }

  /* ---------- results ---------- */
  .resultbar{
    max-width:1400px;
    margin:0 auto;
    padding:20px 24px 4px;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    color:var(--slate);
    font-size:13px;
  }
  .resultbar strong{color:var(--navy);font-family:var(--font-mono);}

  .grid{
    max-width:1400px;
    margin:0 auto;
    padding:12px 24px 60px;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:16px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:10px;
    position:relative;
    transition:box-shadow .18s, transform .18s, border-color .18s;
  }
  .card:hover{
    box-shadow:0 10px 24px rgba(9,26,43,0.10);
    border-color:var(--orange);
    transform:translateY(-2px);
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .tag{
    font-family:var(--font-mono);
    font-size:10.5px;
    padding:3px 8px;
    border-radius:4px;
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .tag.cat{background:var(--tan);color:var(--navy);font-weight:600;}
  .tag.new{background:#e9f9ef;color:#1a8a4d;font-weight:700;}
  .tag.ending{background:#fdeae4;color:var(--danger);font-weight:700;}

  .cashback{
    font-family:var(--font-mono);
    font-weight:700;
    color:var(--orange);
    font-size:22px;
    line-height:1;
    text-align:right;
    flex:none;
  }
  .cashback small{font-size:12px;font-weight:600;}
  .cashback .cap{
    display:block;
    font-size:10px;
    color:var(--slate-soft);
    font-weight:500;
    margin-top:3px;
  }

  .card img.thumb{
    width:100%;
    height:130px;
    object-fit:cover;
    border-radius:6px;
    background:var(--paper);
    border:1px solid var(--line);
  }

  .card .brand-name{
    font-size:12px;
    color:var(--slate);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.3px;
  }
  .card .title{
    font-size:15px;
    font-weight:600;
    line-height:1.35;
    color:var(--navy);
  }
  .card .desc{
    font-size:13px;
    color:var(--slate);
    line-height:1.5;
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .card.expanded .desc{max-height:400px;margin-top:2px;}
  .card-foot{
    margin-top:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:12px;
  }
  .days-left{
    font-family:var(--font-mono);
    color:var(--slate);
  }
  .days-left.soon{color:var(--danger);font-weight:700;}
  .card-links{display:flex;gap:14px;}
  .card-links button, .card-links a{
    background:none;border:none;
    font-family:var(--font-body);
    font-size:12.5px;
    color:var(--slate);
    cursor:pointer;
    text-decoration:none;
    padding:0;
  }
  .card-links a{color:var(--orange-dim);font-weight:600;}
  .card-links a:hover{text-decoration:underline;}
  .card-links button:hover{color:var(--navy);}

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--slate);
  }
  .empty-state .big{font-family:var(--font-mono);font-size:34px;color:var(--slate-soft);margin-bottom:10px;}

  .loadmore-wrap{
    grid-column:1/-1;
    display:flex;
    justify-content:center;
    padding:10px 0 20px;
  }
  .loadmore{
    font-family:var(--font-mono);
    background:var(--navy);
    color:var(--white);
    border:none;
    padding:12px 26px;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  .loadmore:hover{background:var(--orange);}

  .skeleton-grid{
    max-width:1400px;margin:0 auto;padding:20px 24px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;
  }
  .skeleton{
    height:230px;border-radius:10px;
    background:linear-gradient(100deg,var(--paper) 30%,#eceef0 50%,var(--paper) 70%);
    background-size:200% 100%;
    animation:shimmer 1.4s infinite;
  }
  @keyframes shimmer{to{background-position:-200% 0;}}

  footer{
    background:var(--navy);
    color:var(--slate-soft);
    padding:26px 24px;
    font-size:12.5px;
    display:flex;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
  }
  footer a{color:var(--tan);text-decoration:none;}
  footer a:hover{text-decoration:underline;}

  .schema-banner{
    max-width:1400px;margin:14px auto;padding:14px 18px;
    background:#fff6e5;border:1px solid #e0a33a;color:#7a5312;
    border-radius:8px;font-size:13.5px;line-height:1.6;
  }
  .schema-banner code{background:#00000010;padding:1px 5px;border-radius:4px;}
  .pill.status-on{background:var(--navy);color:#fff;border-color:var(--navy);}
  .tag.concept{background:#f3ecff;color:#5b2f9e;}
  .tag.ended{background:#eceff1;color:#5A6670;}
  .tag.upcoming{background:#e8f1fb;color:#0b4f9e;}
  .tag.evergreen{background:#eef7ee;color:#2b6b39;}
  .card.is-ended{opacity:.62;}
  .card.is-ended .thumb{filter:grayscale(1);}
  .cat-src{font-size:10.5px;color:var(--slate-soft);margin-left:6px;}

  .error-banner{
    max-width:1400px;margin:20px auto;padding:16px 20px;
    background:#fdeae4;border:1px solid var(--danger);color:var(--danger);
    border-radius:8px;font-size:13.5px;
  }

  @media (max-width:640px){
    .topbar{padding:12px 16px;}
    .filterbar,.catrow,.resultbar,.grid,.skeleton-grid{padding-left:16px;padding-right:16px;}
    .brand .sub{display:none;}
    .stat{padding:12px 16px;min-width:120px;}
    .stat .num{font-size:20px;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark">BOG</span>
    <span>Offers Intelligence</span>
    <span class="sub">/ TBC Bank Monitor</span>
  </div>
  <nav class="topnav">
    <a href="briefing.html" class="navlink">ბრიფინგი</a>
    <a href="dashboard.html" class="navlink">ანალიტიკა</a>
    <a href="index.html" class="navlink active">შეთავაზებები</a>
  </nav>
  <div class="status-pill" id="statusPill">
    <span class="status-dot"></span>
    <span id="statusText">იტვირთება...</span>
  </div>
</header>

<div class="statstrip" id="statStrip"></div>

<div class="ticker-wrap" aria-hidden="true">
  <div class="ticker" id="ticker">იტვირთება ცოცხალი მონაცემები…</div>
</div>

<div class="filterbar">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="მოძებნე ბრენდი, სათაური ან აღწერა…" aria-label="ძებნა">
  </div>
  <button class="toggle-btn" id="soonToggle" aria-pressed="false">
    <span class="dotmark"></span> მალე იწურება
  </button>
  <button class="toggle-btn" id="newToggle" aria-pressed="false">
    <span class="dotmark"></span> ახალი დღეს
  </button>
  <select id="sortSelect" aria-label="დალაგება">
    <option value="cashback_desc">ქეშბექი: მაღალი → დაბალი</option>
    <option value="ending_soon">ვადა: მალე იწურება</option>
    <option value="cap_desc">ლიმიტი: მაღალი → დაბალი</option>
    <option value="duration">ხანგრძლივობა: გრძელი → მოკლე</option>
    <option value="newest">უახლესი</option>
    <option value="az">ბრენდი: ა–ჰ</option>
  </select>
</div>

<div id="bannerHost"></div>

<div class="catrow" id="segmentRow" aria-label="სეგმენტი"></div>

<div class="catrow" id="statusRow" aria-label="სტატუსი"></div>

<div class="catrow" id="catRow"></div>

<div class="resultbar">
  <div><strong id="resultCount">0</strong> შეთავაზება ნაპოვნია</div>
  <div id="lastSync"></div>
</div>

<div id="skeletonGrid" class="skeleton-grid">
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
</div>

<div class="grid" id="grid" style="display:none;"></div>

<footer>
  <div>მონაცემები განახლდება ყოველდღიურად GitHub Actions-ის მეშვეობით — <a href="https://github.com/jinchara/Offers_Bot" target="_blank" rel="noopener">jinchara/Offers_Bot</a></div>
  <div>შიდა ანალიტიკური ხელსაწყო — Bank of Georgia</div>
</footer>

<script src="offers-core.js"></script>
<script>
(function(){
  "use strict";

  var C = window.OffersCore;

  var grid = document.getElementById('grid');
  var skeletonGrid = document.getElementById('skeletonGrid');
  var resultCountEl = document.getElementById('resultCount');
  var lastSyncEl = document.getElementById('lastSync');
  var statusPill = document.getElementById('statusPill');
  var statusText = document.getElementById('statusText');
  var statStrip = document.getElementById('statStrip');
  var ticker = document.getElementById('ticker');
  var catRow = document.getElementById('catRow');
  var statusRow = document.getElementById('statusRow');
  var segmentRow = document.getElementById('segmentRow');
  var searchInput = document.getElementById('searchInput');
  var sortSelect = document.getElementById('sortSelect');
  var soonToggle = document.getElementById('soonToggle');
  var newToggle = document.getElementById('newToggle');

  var ALL_OFFERS = [];
  var LATEST_DATE = null;

  /*
   * Default view is live offers only. This is the fix for the original
   * complaint: finished campaigns used to sit in the grid labelled
   * "მალე იწურება" with 0 days left, and they were counted in every
   * average. Ended offers are still reachable — they're one filter away —
   * because month-over-month analysis needs them.
   */
  var state = {
    q: '',
    category: 'ყველა',
    statusFilter: 'live',
    segment: 'All',
    soon: false,
    freshOnly: false,
    sort: 'cashback_desc',
    visible: 60
  };

  var STATUS_FILTERS = [
    { key: 'live',        label: 'აქტიური' },
    { key: 'ending_soon', label: 'მალე იწურება' },
    { key: 'upcoming',    label: 'ჯერ არ დაწყებულა' },
    { key: 'ended',       label: 'დასრულებული' },
    { key: 'all',         label: 'ყველა (არქივთან ერთად)' }
  ];

  /*
   * TBC splits its offer wall by audience: All, Concept (their premium
   * tier) and ForYouth. The same merchant can appear in one, two or all
   * three, and an offer that runs ONLY in Concept is a retention play for
   * high-value customers rather than a mass-market push — worth being able
   * to isolate.
   *
   * Offers scraped before segment tracking have no `segments`, so they're
   * treated as belonging to All rather than being hidden.
   */
  var SEGMENTS = [
    { key: 'All',      label: 'ყველა შეთავაზება' },
    { key: 'Concept',  label: 'კონცეპტი' },
    { key: 'ForYouth', label: 'ახალი თაობისთვის' },
    /* Not a tab on TBC's own site — this audience is flagged isHidden in
       their API and has no public filter. Visible here because it's in the
       data and worth knowing about. */
    { key: 'Expats',   label: 'ექსპატები' }
  ];

  function offerSegments(o){
    return (o.segments && o.segments.length) ? o.segments : ['All'];
  }

  function matchesSegment(o){
    return offerSegments(o).indexOf(state.segment) !== -1;
  }

  function renderSegmentPills(){
    var counts = {};
    SEGMENTS.forEach(function(seg){
      counts[seg.key] = ALL_OFFERS.filter(function(o){
        return offerSegments(o).indexOf(seg.key) !== -1;
      }).length;
    });
    /* Hide the control entirely when nothing has been segment-tagged yet —
       three buttons all reading the same number is just noise. */
    if(counts.Concept === 0 && counts.ForYouth === 0 && counts.Expats === 0){
      segmentRow.style.display = 'none';
      return;
    }
    segmentRow.innerHTML = SEGMENTS.filter(function(seg){
      /* Don't render a tab for an audience with nothing in it. */
      return seg.key === 'All' || counts[seg.key] > 0;
    }).map(function(seg){
      var on = seg.key === state.segment;
      return '<button class="pill' + (on ? ' status-on' : '') + '" data-seg="' + seg.key + '"' +
             ' aria-pressed="' + on + '">' + C.escapeHtml(seg.label) +
             ' <span style="opacity:.6">' + counts[seg.key] + '</span></button>';
    }).join('');
    segmentRow.querySelectorAll('.pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.segment = btn.dataset.seg;
        state.category = 'ყველა';
        state.visible = 60;
        renderSegmentPills();
        renderStatusPills();
        renderCategoryPills();
        renderGrid();
      });
    });
  }

  function matchesStatus(o){
    switch(state.statusFilter){
      case 'live':        return o.is_live;
      case 'ending_soon': return o.status === 'ending_soon';
      case 'upcoming':    return o.status === 'upcoming';
      case 'ended':       return o.status === 'ended';
      default:            return true;
    }
  }

  /* The pool the current status filter is looking at, before the category,
     search and toggle filters narrow it further. */
  function statusPool(){
    return ALL_OFFERS.filter(function(o){ return matchesStatus(o) && matchesSegment(o); });
  }

  function renderStats(offers){
    var liveOffers = C.live(offers);
    var merchant = C.merchantsOnly(liveOffers);
    var endingSoon = liveOffers.filter(function(o){ return o.status === 'ending_soon'; });
    var upcoming = offers.filter(function(o){ return o.status === 'upcoming'; });
    var withCashback = merchant
      .filter(function(o){ return o.cashback_percent; })
      .map(function(o){ return o.cashback_percent; });
    var freshCount = offers.filter(function(o){ return o.first_seen === LATEST_DATE; }).length;

    statStrip.innerHTML =
      '<div class="stat"><div class="num">' + liveOffers.length + '</div>' +
        '<div class="lbl">აქტიური შეთავაზება</div></div>' +
      '<div class="stat tan"><div class="num">' + Math.round(C.mean(withCashback)) + '%</div>' +
        '<div class="lbl">საშ. ქეშბექი (აქტიური)</div></div>' +
      '<div class="stat"><div class="num">' + endingSoon.length + '</div>' +
        '<div class="lbl">იწურება ' + C.ENDING_SOON_DAYS + ' დღეში</div></div>' +
      '<div class="stat tan"><div class="num">' + upcoming.length + '</div>' +
        '<div class="lbl">დაანონსებული</div></div>' +
      '<div class="stat"><div class="num">' + freshCount + '</div>' +
        '<div class="lbl">დღეს დამატებული</div></div>';
  }

  function renderTicker(offers){
    var top = C.merchantsOnly(C.live(offers))
      .filter(function(o){ return o.cashback_percent; })
      .sort(function(a,b){ return b.cashback_percent - a.cashback_percent; })
      .slice(0, 24);
    var items = top.map(function(o){
      return '<span class="item">' + C.escapeHtml(o.brand || o.title) +
             ' <span class="up">▲ ' + o.cashback_percent + '%</span></span>';
    }).join('');
    ticker.innerHTML = items + items;   // duplicated for a seamless loop
  }

  function renderStatusPills(){
    var pool = ALL_OFFERS.filter(matchesSegment);
    var counts = {
      live: pool.filter(function(o){ return o.is_live; }).length,
      ending_soon: pool.filter(function(o){ return o.status === 'ending_soon'; }).length,
      upcoming: pool.filter(function(o){ return o.status === 'upcoming'; }).length,
      ended: pool.filter(function(o){ return o.status === 'ended'; }).length,
      all: pool.length
    };
    statusRow.innerHTML = STATUS_FILTERS.map(function(f){
      var on = f.key === state.statusFilter;
      return '<button class="pill' + (on ? ' status-on' : '') + '" data-status="' + f.key + '"' +
             ' aria-pressed="' + on + '">' + C.escapeHtml(f.label) +
             ' <span style="opacity:.6">' + counts[f.key] + '</span></button>';
    }).join('');
    statusRow.querySelectorAll('.pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.statusFilter = btn.dataset.status;
        state.category = 'ყველა';
        state.visible = 60;
        renderStatusPills();
        renderCategoryPills();
        renderGrid();
      });
    });
  }

  function renderCategoryPills(){
    var pool = statusPool();
    var counts = {};
    pool.forEach(function(o){
      var c = o.category || 'სხვა';
      counts[c] = (counts[c] || 0) + 1;
    });
    var cats = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a]; });
    var all = [['ყველა', pool.length]].concat(cats.map(function(c){ return [c, counts[c]]; }));
    catRow.innerHTML = all.map(function(pair){
      return '<button class="pill" data-cat="' + C.escapeHtml(pair[0]) + '"' +
             ' aria-pressed="' + (pair[0] === state.category) + '">' +
             C.escapeHtml(pair[0]) + ' <span style="opacity:.6">' + pair[1] + '</span></button>';
    }).join('');
    catRow.querySelectorAll('.pill').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.category = btn.dataset.cat;
        state.visible = 60;
        catRow.querySelectorAll('.pill').forEach(function(b){
          b.setAttribute('aria-pressed', b === btn);
        });
        renderGrid();
      });
    });
  }

  function matchesFilters(o){
    if(!matchesStatus(o)) return false;
    if(!matchesSegment(o)) return false;
    if(state.category !== 'ყველა' && (o.category || 'სხვა') !== state.category) return false;
    if(state.soon && o.status !== 'ending_soon') return false;
    if(state.freshOnly && o.first_seen !== LATEST_DATE) return false;
    if(state.q){
      var q = state.q.toLowerCase();
      var hay = ((o.title||'') + ' ' + (o.brand||'') + ' ' +
                 (o.description||'') + ' ' + (o.category||'')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }

  function sortOffers(list){
    var arr = list.slice();
    switch(state.sort){
      case 'cashback_desc':
        arr.sort(function(a,b){ return (b.cashback_percent||0) - (a.cashback_percent||0); });
        break;
      case 'ending_soon':
        /* Offers with no end date sort last rather than first — an
           open-ended offer is not "ending soonest". */
        arr.sort(function(a,b){
          var av = a.days_left === null || a.days_left === undefined ? 99999 : a.days_left;
          var bv = b.days_left === null || b.days_left === undefined ? 99999 : b.days_left;
          return av - bv;
        });
        break;
      case 'cap_desc':
        arr.sort(function(a,b){ return (b.cap_amount||0) - (a.cap_amount||0); });
        break;
      case 'duration':
        arr.sort(function(a,b){ return (b.duration_days||0) - (a.duration_days||0); });
        break;
      case 'newest':
        arr.sort(function(a,b){ return (b.first_seen||'').localeCompare(a.first_seen||''); });
        break;
      case 'az':
        arr.sort(function(a,b){
          return (a.brand||a.title||'').localeCompare(b.brand||b.title||'', 'ka');
        });
        break;
    }
    return arr;
  }

  var STATUS_TAG_CLASS = {
    ending_soon: 'ending',
    ended: 'ended',
    upcoming: 'upcoming',
    evergreen: 'evergreen'
  };

  function cardHtml(o){
    var isNew = o.first_seen === LATEST_DATE;
    var capText = o.cap_unlimited ? 'ულიმიტო' : (o.cap_amount ? 'მაქს. ' + o.cap_amount + '₾' : '');
    var tagClass = STATUS_TAG_CLASS[o.status];
    var statusTag = tagClass
      ? '<span class="tag ' + tagClass + '">' + C.escapeHtml(o.status_label) + '</span>' : '';
    /* Categories are inferred, so show where each one came from on hover
       rather than presenting a guess as fact. */
    var srcTitle = 'წყარო: ' + (o.category_source || 'unknown') +
                   ' / სანდოობა: ' + (o.category_confidence || '—');

    return '<article class="card' + (o.status === 'ended' ? ' is-ended' : '') +
             '" tabindex="0" data-slug="' + C.escapeHtml(o.slug) + '">' +
      (o.image ? '<img class="thumb" src="' + C.escapeHtml(o.image) +
        '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '') +
      '<div class="card-top"><div class="card-tags">' +
        '<span class="tag cat" title="' + C.escapeHtml(srcTitle) + '">' +
          C.escapeHtml(o.category || 'სხვა') + '</span>' +
        (isNew ? '<span class="tag new">ახალი</span>' : '') +
        (o.concept_only ? '<span class="tag concept">კონცეპტი</span>' : '') +
        statusTag +
      '</div>' +
      (o.cashback_percent ? '<div class="cashback">' + o.cashback_percent + '<small>%</small>' +
        (capText ? '<span class="cap">' + C.escapeHtml(capText) + '</span>' : '') + '</div>' : '') +
      '</div>' +
      '<div class="brand-name">' + C.escapeHtml(o.brand || '') + '</div>' +
      '<div class="title">' + C.escapeHtml(o.title || '') + '</div>' +
      (o.description ? '<div class="desc">' + C.escapeHtml(o.description) + '</div>' : '') +
      '<div class="card-foot">' +
        '<span class="days-left' + (o.status === 'ending_soon' ? ' soon' : '') + '">' +
          C.escapeHtml(o.days_left_label) + '</span>' +
        '<span class="card-links">' +
          (o.description ? '<button class="expand-btn" type="button">დეტალები</button>' : '') +
          (o.url ? '<a href="' + C.escapeHtml(o.url) +
            '" target="_blank" rel="noopener">TBC-ზე ნახვა ↗</a>' : '') +
        '</span>' +
      '</div></article>';
  }

  function renderGrid(){
    var filtered = sortOffers(ALL_OFFERS.filter(matchesFilters));
    resultCountEl.textContent = filtered.length;

    if(filtered.length === 0){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">' +
        '<div class="big">∅</div>ამ ფილტრებით შეთავაზება არ მოიძებნა. ' +
        'სცადე სტატუსის შეცვლა ან ძებნის გასუფთავება.</div>';
      return;
    }

    grid.innerHTML = filtered.slice(0, state.visible).map(cardHtml).join('');

    grid.querySelectorAll('.expand-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var card = btn.closest('.card');
        card.classList.toggle('expanded');
        btn.textContent = card.classList.contains('expanded') ? 'დამალვა' : 'დეტალები';
      });
    });

    if(filtered.length > state.visible){
      var wrap = document.createElement('div');
      wrap.className = 'loadmore-wrap';
      var more = Math.min(60, filtered.length - state.visible);
      wrap.innerHTML = '<button class="loadmore" type="button">კიდევ ' + more +
                       ' შეთავაზების ჩვენება</button>';
      wrap.querySelector('button').addEventListener('click', function(){
        state.visible += 60;
        renderGrid();
      });
      grid.appendChild(wrap);
    }
  }

  function debounce(fn, ms){
    var t;
    return function(){
      var args = arguments;
      clearTimeout(t);
      t = setTimeout(function(){ fn.apply(null, args); }, ms);
    };
  }

  searchInput.addEventListener('input', debounce(function(e){
    state.q = e.target.value.trim();
    state.visible = 60;
    renderGrid();
  }, 180));

  sortSelect.addEventListener('change', function(e){
    state.sort = e.target.value;
    renderGrid();
  });

  soonToggle.addEventListener('click', function(){
    state.soon = !state.soon;
    soonToggle.setAttribute('aria-pressed', state.soon);
    state.visible = 60;
    renderGrid();
  });

  newToggle.addEventListener('click', function(){
    state.freshOnly = !state.freshOnly;
    newToggle.setAttribute('aria-pressed', state.freshOnly);
    state.visible = 60;
    renderGrid();
  });

  C.loadAll().then(function(data){
    ALL_OFFERS = data.offers;
    LATEST_DATE = ALL_OFFERS.reduce(function(max, o){
      return (o.last_seen && o.last_seen > max) ? o.last_seen : max;
    }, '');

    statusText.textContent = 'ცოცხალი — ' + (LATEST_DATE || '');
    lastSyncEl.textContent = 'ბოლო სინქრონიზაცია: ' + (LATEST_DATE || '—');

    C.renderSchemaWarning(document.getElementById('bannerHost'), data);
    renderSegmentPills();
    renderStats(ALL_OFFERS);
    renderTicker(ALL_OFFERS);
    renderStatusPills();
    renderCategoryPills();

    skeletonGrid.style.display = 'none';
    grid.style.display = 'grid';
    renderGrid();
  }).catch(function(err){
    skeletonGrid.style.display = 'none';
    statusText.textContent = 'შეცდომა';
    statusPill.querySelector('.status-dot').style.background = '#e2401f';
    grid.style.display = 'grid';
    grid.innerHTML = '<div class="error-banner" style="grid-column:1/-1;">' +
      'მონაცემები ვერ ჩაიტვირთა. გვერდი უნდა იყოს იმავე რეპოზიტორიაში, სადაც ' +
      '<code>data/offers.json</code> (GitHub Pages), ან შეამოწმე ინტერნეტ კავშირი.<br><br>' +
      'დეტალები: ' + C.escapeHtml(err.message) + '</div>';
  });
})();
</script>
</body>
</html>
