name: TBC Offers Reports

on:
  schedule:
    # Weekly report: every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
    # Monthly report: 1st of the month at 08:15 UTC
    - cron: "15 8 1 * *"
  workflow_dispatch:
    inputs:
      period:
        description: "Report period"
        required: true
        default: "weekly"
        type: choice
        options:
          - weekly
          - monthly

permissions:
  contents: read

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # DejaVu (matplotlib's default) does cover Georgian, but not the
      # lari sign. Noto gives us both, so chart labels render in full.
      - name: Install Georgian fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine period
        id: period
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "period=${{ inputs.period }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "15 8 1 * *" ]; then
            echo "period=monthly" >> "$GITHUB_OUTPUT"
          else
            echo "period=weekly" >> "$GITHUB_OUTPUT"
          fi

      - name: Run report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python reports.py ${{ steps.period.outputs.period }}
