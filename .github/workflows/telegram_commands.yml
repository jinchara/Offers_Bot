name: Telegram Bot Commands

on:
  schedule:
    # Polls for new Telegram commands every 10 minutes. Note: GitHub's
    # actual scheduler can delay this further under load (sometimes
    # 15-20+ minutes on free/public repos) - this is "fairly responsive",
    # not instant.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you trigger it manually to test right away

permissions:
  contents: write   # needed to commit the updated telegram_offset.json back

jobs:
  poll-commands:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll for and respond to commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_commands.py

      - name: Commit updated offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/telegram_offset.json
          git diff --cached --quiet || git commit -m "Update telegram offset [skip ci]"
          git push