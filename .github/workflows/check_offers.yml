name: Check TBC Offers

on:
  schedule:
    # Runs daily at 07:00 UTC (11:00 Tbilisi time). Adjust as you like:
    # cron fields are: minute hour day month weekday
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit data/ back to the repo

jobs:
  check-offers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Cheap guard: if a parsing rule regressed, fail here rather than
      # committing bad data over a known-good offers.json.
      - name: Run tests
        run: python test_parse.py

      - name: Run daily offer check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/offers.json data/history.jsonl data/insights.json data/facet_map.json
          git diff --cached --quiet || git commit -m "Update offers data [skip ci]"
          git push
